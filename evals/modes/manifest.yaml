# Eval theo mode — fixture sample-app. Mỗi task đặt `mode` (agent/plan/ask/debug/review/multitask).
# Read-only modes (ask/review/plan) dùng `unchanged` để chắc chắn không file nào bị sửa.
# Hướng dẫn chạy, ghim model, lịch sử: evals/README.md

workspace: fixtures/sample-app
setup: []
verify_cmd: python -m tests.runner

tasks:
  - id: M01-ask-no-edit
    kind: explore
    mode: ask
    prompt: "Sửa mul() trong src/calc.py cho đúng giúp tôi."
    pass_if:
      unchanged:
        - src/calc.py
      report_mentions:
        - mul
        - "[event:mode_suggestion]"   # Ask phải gợi ý chuyển sang Agent, không chỉ nói bằng chữ

  - id: M02-review-finds-bugs
    kind: explore
    mode: review
    prompt: "Review src/calc.py và src/stats.py, báo bug kèm dòng."
    pass_if:
      unchanged:
        - src/calc.py
        - src/stats.py
      report_mentions:
        - mul
        - mean

  - id: M03-debug-fixes-with-evidence
    kind: bugfix
    mode: debug
    prompt: "test_factorial đang fail. Tìm nguyên nhân và sửa."
    verify_filter: test_factorial
    pass_if:
      test: test_factorial

  - id: M04-plan-no-edit
    kind: plan
    mode: plan
    prompt: "Lập plan sửa mean([]) trả 0.0."
    pass_if:
      unchanged:
        - src/stats.py
      plan_mentions:
        - mean

  - id: M05-multitask-two-fixes
    kind: bugfix
    mode: multitask
    prompt: "Sửa hai việc độc lập: mul() phải nhân (src/calc.py) và UserStore.get trả None khi thiếu user (src/user.py)."
    pass_if:
      test: test_mul

  # Khối "Runtime environment" (crates/runtime/src/agent/env.rs): agent trả lời câu hỏi về chính
  # nó từ dữ kiện harness đưa, không đoán. Model biết tên mình từ lúc huấn luyện, nên check phân
  # biệt là effort `low` (chỉ có trong khối env) và cách hỏi khác lối.
  - id: M06-ask-runtime-env
    kind: explore
    mode: ask
    model: claude-haiku
    effort: low
    prompt: "Cho tôi biết bạn đang chạy model gì, qua nguồn nào, và effort đang để mức nào. Trả lời ngắn."
    pass_if:
      unchanged:
        - src/calc.py
      report_mentions:
        - Haiku
        - low
      max_report_chars: 800
    # Chặn tốn kém: trả lời từ khối env trong một lần gọi; đi đọc file hay lặp là hồi quy dù
    # câu trả lời đúng. Cũng kiểm khối env vẫn tới được model sau khi tách khỏi system tĩnh.
    budget:
      max_turns: 3

  # Model Auto: chọn slot theo mode + mục đích, không đọc prompt (crates/runtime/src/agent/auto.rs).
  # Kiểm slot qua dòng `route` trong audit (`detail.slot`). Metrics ghi `slots`, `escalated`, `usd_by_slot`.
  - id: A01-auto-plan-frontier
    kind: plan
    mode: plan
    model: auto
    prompt: "Lập plan sửa moving_average trong src/stats.py cho đúng cửa sổ trượt."
    pass_if:
      unchanged:
        - src/stats.py
      plan_mentions:
        - moving_average
      audit_matches:
        - '"kind":"route".*"slot":"frontier"'

  - id: A02-auto-ask-strong
    kind: explore
    mode: ask
    model: auto
    prompt: "median() trong src/stats.py xử lý danh sách số chẵn phần tử thế nào?"
    pass_if:
      unchanged:
        - src/stats.py
      report_mentions:
        - median
      audit_matches:
        - '"kind":"route".*"slot":"strong"'
      audit_absent:
        - '"kind":"route".*"slot":"frontier"'

  - id: A03-auto-agent-bugfix
    kind: bugfix
    mode: agent
    model: auto
    # Lỗi off-by-one dễ sửa sai lần đầu: nếu test còn đỏ sau khi sửa, Auto leo cấp (effort rồi
    # Frontier). Pass chỉ đòi test xanh và lượt bắt đầu ở Strong; có leo hay không thì xem
    # `escalated` trong metrics (không bắt buộc: model sửa đúng ngay thì không leo). Logic leo
    # cấp được kiểm chắc chắn bằng unit test (`agent/auto.rs`); task này kiểm đường đi thật.
    # CI chạy với `--retry-failed`.
    prompt: "test_moving_average đang fail. Sửa moving_average trong src/stats.py, chạy lại test cho tới khi xanh."
    verify_filter: test_moving_average
    pass_if:
      test: test_moving_average
      audit_matches:
        - '"kind":"route".*"slot":"strong"'

  - id: A04-auto-knows-route
    kind: explore
    mode: ask
    model: auto
    # Hỏi gián tiếp: agent phải nói được model do Auto chọn (không phải user) và slot hiện tại.
    prompt: "Ai chọn model cho câu trả lời này, tôi hay app? Nếu là app thì đang ở mức (slot) nào?"
    pass_if:
      unchanged:
        - src/calc.py
      report_mentions:
        - Auto
        - strong
      audit_matches:
        - '"kind":"route".*"slot":"strong"'

  - id: S01-style-concise
    kind: explore
    mode: ask
    style: concise
    # Settings → Trò chuyện → Phong cách trả lời = Ngắn gọn. Ở style mặc định câu này thường ra
    # một đoạn giải thích dài kèm ví dụ; concise phải trả lời đúng mà ngắn.
    prompt: "mean() trong src/stats.py làm gì khi danh sách rỗng?"
    pass_if:
      unchanged:
        - src/stats.py
      report_mentions:
        - mean
        - ZeroDivisionError
      max_report_chars: 600

  # Ngôn ngữ trả lời do Engine quyết (crates/runtime/src/lang.rs → dòng "Reply language" trong
  # <turn_context>). L01: một câu tiếng Việt ngắn kèm traceback tiếng Anh dài — trước đây model dễ
  # trả lời theo phần log. L02: câu tiếng Anh thì vẫn trả lời tiếng Anh (không ép tiếng Việt).
  - id: L01-reply-lang-vi-with-english-log
    kind: explore
    mode: ask
    prompt: |
      lỗi gì đây?
      Traceback (most recent call last):
        File "tests/runner.py", line 12, in <module>
          print(mean([]))
        File "src/stats.py", line 5, in mean
          return sum(values) / len(values)
      ZeroDivisionError: division by zero
    pass_if:
      unchanged:
        - src/stats.py
      report_mentions:
        - mean
      report_lang: vi
    budget:
      max_turns: 4

  - id: L02-reply-lang-en
    kind: explore
    mode: ask
    prompt: "Why does mean() in src/stats.py crash on an empty list? Answer briefly."
    pass_if:
      unchanged:
        - src/stats.py
      report_mentions:
        - ZeroDivisionError
      report_lang: en
    budget:
      max_turns: 4

  # Chỉ dẫn workspace (crates/runtime/src/org.rs). I01: vendor/AGENTS.md lồng nhau chỉ tới với
  # kết quả read/edit đầu tiên trong vendor/ (không có trong system prompt), agent phải theo nó.
  # I02: system chỉ liệt kê tên + mô tả skill; mã RN-7 chỉ có trong thân skill, nên report có
  # RN-7 nghĩa là agent đã gọi tool `skill`.
  - id: I01-nested-agents-md
    kind: edit
    mode: agent
    prompt: "Thêm hàm report_total(rows) vào vendor/legacy_report.py: trả tổng row.get(\"v1\", 0) của mọi row."
    pass_if:
      grep:
        - path: vendor/legacy_report.py
          pattern: '# patched-by-agent\s+def report_total'
      unchanged:
        - src/calc.py

  - id: I02-skill-on-demand
    kind: explore
    mode: ask
    prompt: "Viết release notes cho thay đổi: mul() trong src/calc.py giờ nhân đúng thay vì cộng."
    pass_if:
      unchanged:
        - src/calc.py
      report_mentions:
        - RN-7
    budget:
      max_turns: 4

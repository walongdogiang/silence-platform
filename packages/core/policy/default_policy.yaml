  - { match: [printenv], code: ENV_READ }
  - { match: [set], code: ENV_READ }
  - { match: [get-childitem, "env:"], code: ENV_READ }

  # dynamic execution
  - { match: [invoke-expression], code: DYNAMIC_EXEC }
  - { match: [eval], code: DYNAMIC_EXEC }
  - { match: [invoke-command], code: DYNAMIC_EXEC }
  - { match: [source], code: DYNAMIC_EXEC }

  # filesystem mutations
  - { match: [remove-item], code: FS_DELETE }
  - { match: [clear-content], code: FS_DELETE }
  - { match: [copy-item], code: WRITE_WS }
  - { match: [move-item], code: WRITE_WS }
  - { match: [new-item], code: WRITE_WS }
  - { match: [set-content], code: WRITE_WS }
  - { match: [add-content], code: WRITE_WS }
  - { match: [out-file], code: WRITE_WS }
  - { match: [touch], code: WRITE_WS }
  - { match: [rename-item], code: WRITE_WS }

  # read-only
  - { match: [get-childitem], code: READ_CMD }
  - { match: [get-content], code: READ_CMD }
  - { match: [get-item], code: READ_CMD }
  - { match: [test-path], code: READ_CMD }
  - { match: [get-location], code: READ_CMD }
  - { match: [resolve-path], code: READ_CMD }
  - { match: [get-command], code: READ_CMD }
  - { match: [write-output], code: READ_CMD }
  - { match: [write-host], code: READ_CMD }
  - { match: [select-string], code: READ_CMD }
  - { match: [select-object], code: READ_CMD }
  - { match: [where-object], code: READ_CMD }
  - { match: [foreach-object], code: READ_CMD }
  - { match: [sort-object], code: READ_CMD }
  - { match: [measure-object], code: READ_CMD }
  - { match: [format-table], code: READ_CMD }
  - { match: [format-list], code: READ_CMD }
  - { match: [out-string], code: READ_CMD }
  - { match: [convertfrom-json], code: READ_CMD }
  - { match: [convertto-json], code: READ_CMD }
  - { match: [findstr], code: READ_CMD }
  - { match: [where], code: READ_CMD }
  - { match: [which], code: READ_CMD }
  - { match: [rg], code: READ_CMD }
  - { match: [grep], code: READ_CMD }
  - { match: [find], code: FS_DELETE, flags_any: ["-delete"] }
  - { match: [find], code: DYNAMIC_EXEC, flags_any: ["-exec", "-execdir", "-ok"] }
  - { match: [find], code: READ_CMD }
  - { match: [head], code: READ_CMD }
  - { match: [tail], code: READ_CMD }
  - { match: [wc], code: READ_CMD }
  - { match: [sort], code: READ_CMD }
  - { match: [uniq], code: READ_CMD }
  - { match: [tree], code: READ_CMD }
  - { match: [true], code: READ_CMD }

# Exec sinks: a pipeline segment that runs its stdin / an argument as code.
exec_sinks: [sh, bash, zsh, cmd, powershell, pwsh, invoke-expression, python, python3, node, perl, ruby]
# Downloaders: earlier pipeline segments that fetch remote content.
downloaders: [curl, invoke-webrequest, invoke-restmethod, start-bitstransfer]
# Interpreters: run a script file (RUN_SCRIPT) or inline code (INLINE_CODE).
interpreters: [python, python3, py, node, deno, bun, ruby, perl, powershell, pwsh, bash, sh, cmd]
# Flags that mean "inline code follows" for interpreters.
inline_flags: ["-c", "-e", "--eval", "-command", "/c", "-p"]
# Flags that mean "encoded command" for powershell/pwsh.
encoded_flags: ["-encodedcommand", "-enc", "-ec", "-en", "-encoded"]
# Upload flags: combined with a secret path → SECRET_EXFIL.
upload_flags: ["-d", "--data", "--data-binary", "-f", "--form", "-t", "--upload-file", "-infile", "-body"]
# Secret path patterns (case-insensitive, matched on path basename or any segment).
secret_patterns: [".env", ".env.*", "*.pem", "*.key", "*.pfx", "*.p12", "id_rsa", "id_rsa.*", "id_ed25519", "id_ed25519.*", ".ssh", ".aws", ".npmrc", ".pypirc", ".git-credentials", ".netrc", "credentials", "credentials.json", "secrets.*"]
# Codes that always re-ask: "remember" is ignored for a verdict containing any of them.
never_remember: [PKG_PUBLISH, GH_MERGE, GIT_DESTRUCTIVE, FS_DELETE, FS_OUTSIDE_WS, SECRET_READ, ENV_READ, UNPARSED, DYNAMIC_EXEC, INLINE_CODE, TAINTED_CONTEXT, UNKNOWN_TOOL]
# Codes whose approved run feeds arbitrary outside text to the model (sets session taint).
# Package/git logs are not included: their output is tool chatter, not fetched content.
taint_codes: [NET_ACCESS, MCP_CALL, MCP_READ]
# Programs whose first non-flag argument is part of the remembered pattern (`npm install *`).
subcommand_programs: [git, npm, pnpm, yarn, bun, cargo, pip, pip3, uv, poetry, go, dotnet, winget, choco, scoop, docker, kubectl, npx, gh]
# Workspace files only the Engine may write.
policy_files: [".silence/permissions.json", ".silence/policy.yaml", ".silence/policy.toml", ".silence/network.json"]

# --- Autonomous mode (sandbox Ready): who decides, see docs/security/permissions.md ---------
# Codes a sandboxed run makes safe enough to skip the question. A call whose verdict has any
# tier>=ask code outside this list (and outside never_escalate) still asks. NET_ACCESS only counts
# when every host is allowlisted; FS_DELETE only when the turn has a git snapshot to undo from.
sandbox_covers: [UNKNOWN_COMMAND, RUN_SCRIPT, BUILD_TEST, INLINE_CODE, DYNAMIC_EXEC, UNPARSED, PKG_EXEC, PKG_INSTALL, FS_DELETE, PROC_KILL, NET_ACCESS, TAINTED_CONTEXT]
# Always ask, even in the sandbox: they act with the real user's identity or leave the machine.
always_ask: [GIT_NETWORK, GIT_COMMIT, GIT_DESTRUCTIVE, GH_WRITE, GH_MERGE, PKG_PUBLISH, MCP_CALL, ENV_READ]
# Blocked calls that the escalation card may never offer to run: the card only has "Dừng".
never_escalate: [POLICY_TAMPER, GIT_PUSH_DEFAULT, GIT_NO_VERIFY, SECRET_EXFIL, NET_DOWNLOAD_EXEC, ENCODED_COMMAND, FS_DELETE_SYSTEM]

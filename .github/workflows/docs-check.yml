name: docs-check

# Docs và rule cho agent:
# - rule .claude/rules/*.md có `paths:` hợp lệ, path còn tồn tại;
# - mọi docs/**/*.md (trừ archive/) có frontmatter hợp lệ và có trong mục lục;
# - test script của todo/ (scripts/todo-brief.mjs, scripts/todo-claims.mjs);
# - test cổng merge PR (scripts/pr-merge.mjs, ngưỡng ở .claude/git-policy.json).
# Tách khỏi ci.yml vì ci.yml bỏ qua thay đổi chỉ chạm **/*.md. Không cần npm install.
# Chạy trên mọi PR (base bất kỳ, kể cả PR xếp chồng) và mỗi lần push main.

on:
  pull_request:
    paths:
      - ".claude/rules/**"
      - "docs/**"
      - "scripts/check-rules.mjs"
      - "scripts/check-docs-meta.mjs"
      - "scripts/frontmatter.mjs"
      - "scripts/todo-*.mjs"
      - "scripts/todo.test.mjs"
      - "scripts/pr-merge*.mjs"
      - ".claude/git-policy.json"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - ".claude/rules/**"
      - "docs/**"
      - "scripts/check-rules.mjs"
      - "scripts/check-docs-meta.mjs"
      - "scripts/frontmatter.mjs"
      - "scripts/todo-*.mjs"
      - "scripts/todo.test.mjs"
      - "scripts/pr-merge*.mjs"
      - ".claude/git-policy.json"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude rules
        run: node scripts/check-rules.mjs
      - name: Docs frontmatter and index
        run: node scripts/check-docs-meta.mjs
      - name: Todo scripts
        run: node --test scripts/todo.test.mjs
      - name: PR merge gate
        run: node --test scripts/pr-merge.test.mjs
